<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letrical - Safina November Ratings & History</title>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(20, 24, 36, 0.85);
      --gold-primary: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --gold-gradient: linear-gradient(135deg, #fbf3b9 0%, #d4af37 50%, #aa7c11 100%);
      --silver-gradient: linear-gradient(135deg, #ffffff 0%, #a8a8a8 50%, #696969 100%);
      --bronze-gradient: linear-gradient(135deg, #f6d3af 0%, #b06d3b 50%, #7d4419 100%);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--gold-gradient);
      color: #000;
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .section-content {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-content.active {
      display: block;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      justify-items: center;
    }

    .fut-card {
      width: 220px;
      height: 330px;
      background: linear-gradient(135deg, #1e2330 0%, #0d1017 100%);
      border-radius: 15px;
      border: 2px solid #d4af37;
      position: relative;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .fut-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 30px var(--gold-glow);
    }

    .fut-card::before {
      content: 'LETRICAL';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 2.2rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      white-space: nowrap;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .rating-box {
      text-align: center;
    }

    .rating-num {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .position-code {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .club-badge {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 0.7rem;
    }

    .player-avatar {
      text-align: center;
      font-size: 3.5rem;
      margin: 10px 0;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
    }

    .player-name {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .badges-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-badge {
      font-size: 0.75rem;
      padding: 3px 7px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
    }

    .badge-goals { color: #60a5fa; border-color: #3b82f6; }
    .badge-ballon { color: #fbbf24; border-color: #f59e0b; }
    .badge-boot { color: #f87171; border-color: #ef4444; }

    .data-table-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .table-title {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: var(--gold-primary);
      text-align: center;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .custom-table th, .custom-table td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .custom-table th {
      color: var(--text-sub);
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .custom-table tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .rank-cell {
      font-weight: 800;
      width: 50px;
    }

    .rank-1 { color: #f59e0b; }
    .rank-2 { color: #d1d5db; }
    .rank-3 { color: #b45309; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="brand-title">Letrical</h1>
    <p class="subtitle">Safina November Ratings & Historical Honours</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('ratings')">Player Cards</button>
    <button class="tab-btn" onclick="switchTab('top-scorers')">Top Scorers</button>
    <button class="tab-btn" onclick="switchTab('ballon-dor')">Ballon d'Or</button>
    <button class="tab-btn" onclick="switchTab('golden-boot')">Former Golden Boots</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">All-in-One Dashboard</button>
  </div>

  <div id="ratings" class="section-content active">
    <div class="cards-grid" id="cards-container"></div>
  </div>

  <div id="top-scorers" class="section-content">
    <div class="data-table-container">
      <h2 class="table-title">Safina November Top Scorers</h2>
      <table class="custom-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Goals</th>
          </tr>
        </thead>
        <tbody id="top-scorers-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="ballon-dor" class="section-content">
    <div class="data-table-container">
      <h2 class="table-title">Ballon d'Or Winners</h2>
      <table class="custom-table">
        <thead>
          <tr>
            <th>Year</th>
            <th>Winner</th>
          </tr>
        </thead>
        <tbody id="ballon-dor-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="golden-boot" class="section-content">
    <div class="data-table-container">
      <h2 class="table-title">Former Golden Boot Winners</h2>
      <table class="custom-table">
        <thead>
          <tr>
            <th>Year / Edition</th>
            <th>Winner</th>
          </tr>
        </thead>
        <tbody id="golden-boot-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="dashboard" class="section-content">
    <div class="dashboard-grid">
      <div class="data-table-container">
        <h2 class="table-title">Top Scorers</h2>
        <table class="custom-table"><tbody id="dash-scorers"></tbody></table>
      </div>
      <div class="data-table-container">
        <h2 class="table-title">Ballon d'Or History</h2>
        <table class="custom-table"><tbody id="dash-ballon"></tbody></table>
      </div>
      <div class="data-table-container">
        <h2 class="table-title">Golden Boot History</h2>
        <table class="custom-table"><tbody id="dash-boot"></tbody></table>
      </div>
    </div>
  </div>

  <script>
    const players = [
      { name: 'Bradley', rating: 91, pos: 'FWD', goals: 27, ballon: 3, boots: 4, avatar: '👑' },
      { name: 'Lenny', rating: 88, pos: 'FWD', goals: 21, ballon: 1, boots: 1, avatar: '⚡' },
      { name: 'James', rating: 86, pos: 'MID', goals: 12, ballon: 0, boots: 0, avatar: '🎯' },
      { name: 'Ryan', rating: 84, pos: 'FWD', goals: 14, ballon: 2, boots: 3, avatar: '🔥' },
      { name: 'Mark', rating: 81, pos: 'MID', goals: 8, ballon: 0, boots: 0, avatar: '🎨' },
      { name: 'Jayden', rating: 80, pos: 'FWD', goals: 17, ballon: 0, boots: 0, avatar: '🚀' },
      { name: 'Danstan', rating: 78, pos: 'GK', goals: 2, ballon: 0, boots: 0, avatar: '🧤' },
      { name: 'Raymond', rating: 78, pos: 'DEF', goals: 4, ballon: 0, boots: 0, avatar: '🛡️' }
    ];

    const topScorers = [
      { rank: 1, name: 'Bradley', goals: 27 },
      { rank: 2, name: 'Lenny', goals: 21 },
      { rank: 3, name: 'Jayden', goals: 17 },
      { rank: 4, name: 'Ryan', goals: 14 },
      { rank: 5, name: 'James', goals: 12 },
      { rank: 6, name: 'Mark', goals: 8 },
      { rank: 7, name: 'Raymond', goals: 4 },
      { rank: 8, name: 'Danstan', goals: 2 }
    ];

    const ballonDorHistory = [
      { year: '2018', winner: 'Richard' },
      { year: '2019', winner: 'Ryan' },
      { year: '2020', winner: 'Bradley' },
      { year: '2021', winner: 'Lenny' },
      { year: '2022', winner: 'Bradley' },
      { year: '2023', winner: 'Ryan' },
      { year: '2024', winner: 'Kelly' },
      { year: '2025', winner: 'Bradley' }
    ];

    const goldenBootHistory = [
      { year: '2018', winner: 'Leon' },
      { year: '2019', winner: 'Manu' },
      { year: '2020', winner: 'Bradley' },
      { year: '2021', winner: 'Ryan' },
      { year: '2022', winner: 'Lenny' },
      { year: '2023', winner: 'Bradley' },
      { year: '2024', winner: 'Ryan' },
      { year: '2025', winner: 'Bradley' },
      { year: '2026 (Apr)', winner: 'Ryan' },
      { year: '2026 (Aug)', winner: 'Bradley' },
      { year: '2026 (Oct)', winner: 'Bradley' }
    ];

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = players.map(p => `
        <div class="fut-card">
          <div class="card-top">
            <div class="rating-box">
              <div class="rating-num">${p.rating}</div>
              <div class="position-code">${p.pos}</div>
            </div>
            <div class="club-badge">LET</div>
          </div>
          <div class="player-avatar">${p.avatar}</div>
          <div>
            <div class="player-name">${p.name}</div>
            <div class="badges-container">
              <span class="mini-badge badge-goals">⚽ ${p.goals} G</span>
              ${p.ballon > 0 ? `<span class="mini-badge badge-ballon">🏆 x${p.ballon}</span>` : ''}
              ${p.boots > 0 ? `<span class="mini-badge badge-boot">👟 x${p.boots}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderTables() {
      const tsBody = document.getElementById('top-scorers-tbody');
      const dashScorers = document.getElementById('dash-scorers');
      const tsHTML = topScorers.map(s => `
        <tr>
          <td class="rank-cell rank-${s.rank}">#${s.rank}</td>
          <td><strong>${s.name}</strong></td>
          <td>⚽ ${s.goals}</td>
        </tr>
      `).join('');
      tsBody.innerHTML = tsHTML;
      dashScorers.innerHTML = tsHTML;

      const bdBody = document.getElementById('ballon-dor-tbody');
      const dashBallon = document.getElementById('dash-ballon');
      const bdHTML = ballonDorHistory.map(b => `
        <tr>
          <td><strong>${b.year}</strong></td>
          <td>🏆 ${b.winner}</td>
        </tr>
      `).join('');
      bdBody.innerHTML = bdHTML;
      dashBallon.innerHTML = bdHTML;

      const gbBody = document.getElementById('golden-boot-tbody');
      const dashBoot = document.getElementById('dash-boot');
      const gbHTML = goldenBootHistory.map(g => `
        <tr>
          <td><strong>${g.year}</strong></td>
          <td>👟 ${g.winner}</td>
        </tr>
      `).join('');
      gbBody.innerHTML = gbHTML;
      dashBoot.innerHTML = gbHTML;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      const targetSection = document.getElementById(tabId);
      if (targetSection) {
        targetSection.classList.add('active');
      }

      const activeButton = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.textContent.trim() === {
        ratings: 'Player Cards',
        'top-scorers': 'Top Scorers',
        'ballon-dor': 'Ballon d\'Or',
        'golden-boot': 'Former Golden Boots',
        dashboard: 'All-in-One Dashboard'
      }[tabId]);

      if (activeButton) {
        activeButton.classList.add('active');
      }
    }

    window.onload = () => {
      renderCards();
      renderTables();
      switchTab('ratings');
    };
  </script>
</body>
</html>
